<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body>
    <div class="bg-white mx-auto max-w-md rounded-lg mt-10 shadow-lg">

    <form class="p-4 flex flex-col gap-2" action="process.php" method="post" enctype="multipart/form-data">
        <label for="">Customer Full Name</label>
        <input type="text" name="Customer_FullName" id=""
        class="box-border w-full p-3 border border-gray-300
            rounded-lg  focus:border-blue-500 focus:outline-none">
        <label for="">Account Number</label>
        <input type="text" name="Account_Number" id=""
        class="box-border w-full p-3 border border-gray-300
            rounded-lg  focus:border-blue-500 focus:outline-none">

         <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">
                    Gender:
                </label>

                <div class="flex gap-6">
                    <label class="flex items-center gap-2">
                        <input type="radio" name="gender" value="Male">
                        Male
                    </label>

                    <label class="flex items-center gap-2">
                        <input type="radio" name="gender" value="Female">
                        Female
                    </label>
                </div>
            </div>
        <label for="">Account Type</label>
        <select name="Account_Type" id=""
        class="box-border w-full p-3 border border-gray-300
            rounded-lg  focus:border-blue-500 focus:outline-none">
            <option value="Savings">Savings</option>
            <option value="Current">Current</option>
            <option value="Business">Business</option>
        </select>
        <label for="">Opening Balance</label>
        <input type="number" name="Opening_Balance" id=""
        class="box-border w-full p-3 border border-gray-300
            rounded-lg  focus:border-blue-500 focus:outline-none">
         <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">
                    Transaction Type
                </label>

                <div class="flex gap-6">
                    <label class="flex items-center gap-2">
                        <input type="radio" name="Transaction_Type" value="Withdrawal">
                        Withdrawal
                    </label>

                    <label class="flex items-center gap-2">
                        <input type="radio" name="Deposit" value="Deposit">
                        Deposit
                    </label>
                </div>
            </div>
        <label for="">Account Duration (Years)</label>
        <input type="number" name="Account_Duration" id=""
        class="box-border w-full p-3 border border-gray-300
            rounded-lg  focus:border-blue-500 focus:outline-none">
        <label for="">Identification Document</label>
        <input type="file" name="image" id=""
        class="box-border w-full p-3 border border-gray-300
            rounded-lg  focus:border-blue-500 focus:outline-none">

        <button class="self-center bg-green-500 text-xl rounded w-62 h-10 text-white
             mt-2 hover:bg-green-300">Calculate and Register</button>
    </form>

    </div>
</body>
</html>
