<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Registration</title>

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">

    <div class="bg-white w-full max-w-xl p-6 rounded-lg shadow-md">

        <h2 class="text-2xl font-bold text-center text-gray-800 mb-6">
            Employee Registration Form
        </h2>

        <form action="process.php" method="POST"
              enctype="multipart/form-data" class="space-y-4">

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">
                    Employee Full Name:
                </label>
                <input type="text" name="fullName"
                       class="w-full border border-gray-300 rounded-md p-2 outline-none focus:ring-2 focus:ring-blue-500">
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">
                    Employee ID:
                </label>
                <input type="text" name="employeeId"
                       class="w-full border border-gray-300 rounded-md p-2 outline-none focus:ring-2 focus:ring-blue-500">
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">
                    Gender:
                </label>
                <div class="flex gap-6">
                    <label class="flex items-center gap-2">
                        <input type="radio" name="gender" value="Male">
                        Male
                    </label>

                    <label class="flex items-center gap-2">
                        <input type="radio" name="gender" value="Female">
                        Female
                    </label>
                </div>
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">
                    Department:
                </label>
                <select name="department"
                        class="w-full border border-gray-300 rounded-md p-2 bg-white outline-none focus:ring-2 focus:ring-blue-500">
                    <option value="">Select Department</option>
                    <option value="Human Resources">Human Resources</option>
                    <option value="Finance">Finance</option>
                    <option value="Information Technology">Information Technology</option>
                    <option value="Administration">Administration</option>
                </select>
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">
                    Basic Salary:
                </label>
                <input type="number" name="basicSalary"
                       min="0.01" step="0.01"
                       class="w-full border border-gray-300 rounded-md p-2 outline-none focus:ring-2 focus:ring-blue-500">
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">
                    Allowance:
                </label>
                <input type="number" name="allowance"
                       min="0" step="0.01"
                       class="w-full border border-gray-300 rounded-md p-2 outline-none focus:ring-2 focus:ring-blue-500">
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">
                    Deduction:
                </label>
                <input type="number" name="deduction"
                       min="0" step="0.01"
                       class="w-full border border-gray-300 rounded-md p-2 outline-none focus:ring-2 focus:ring-blue-500">
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">
                    Employee Document:
                </label>
                <input type="file" name="employeeDocument"
                       class="w-full border border-gray-300 rounded-md p-2 text-sm">
            </div>

            <div class="flex gap-3 pt-2">
                <button type="submit"
                        class="flex-1 bg-blue-600 text-white py-2 rounded-md hover:bg-blue-700">
                    Register and Calculate
                </button>

                <button type="reset"
                        class="bg-gray-500 text-white px-5 py-2 rounded-md hover:bg-gray-600">
                    Reset
                </button>
            </div>

        </form>

    </div>

</body>
</html>
