<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Grade Management</title>

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">

    <div class="bg-white w-full max-w-xl p-6 rounded-lg shadow-md">

        <h2 class="text-2xl font-bold text-center text-gray-800 mb-6">
            Student Grade Management Form
        </h2>

        <form action="process.php" method="POST"
              enctype="multipart/form-data" class="space-y-4">

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">
                    Student Full Name:
                </label>
                <input type="text" name="fullName"
                       class="w-full border border-gray-300 rounded-md p-2 outline-none focus:ring-2 focus:ring-blue-500">
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">
                    Student ID:
                </label>
                <input type="text" name="studentId"
                       class="w-full border border-gray-300 rounded-md p-2 outline-none focus:ring-2 focus:ring-blue-500">
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">
                    Gender:
                </label>

                <div class="flex gap-6">
                    <label class="flex items-center gap-2">
                        <input type="radio" name="gender" value="Male">
                        Male
                    </label>

                    <label class="flex items-center gap-2">
                        <input type="radio" name="gender" value="Female">
                        Female
                    </label>
                </div>
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">
                    Faculty:
                </label>

                <select name="faculty"
                        class="w-full border border-gray-300 rounded-md p-2 bg-white outline-none focus:ring-2 focus:ring-blue-500">
                    <option value="">Select Faculty</option>
                    <option value="Information Technology">Information Technology</option>
                    <option value="Business">Business</option>
                    <option value="Engineering">Engineering</option>
                </select>
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">
                    PHP Mark:
                </label>

                <input type="number" name="phpMark" min="0" max="100"
                       class="w-full border border-gray-300 rounded-md p-2 outline-none focus:ring-2 focus:ring-blue-500">
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">
                    Database Mark:
                </label>

                <input type="number" name="databaseMark" min="0" max="100"
                       class="w-full border border-gray-300 rounded-md p-2 outline-none focus:ring-2 focus:ring-blue-500">
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">
                    Networking Mark:
                </label>

                <input type="number" name="networkingMark" min="0" max="100"
                       class="w-full border border-gray-300 rounded-md p-2 outline-none focus:ring-2 focus:ring-blue-500">
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">
                    Student Certificate:
                </label>

                <input type="file" name="certificate"
                       class="w-full border border-gray-300 rounded-md p-2 text-sm">
            </div>

            <div class="flex gap-3 pt-2">
                <input type="submit" value="Submit and Calculate"
                       class="flex-1 bg-blue-600 text-white py-2 rounded-md cursor-pointer hover:bg-blue-700">

                <input type="reset" value="Reset"
                       class="bg-gray-500 text-white px-5 py-2 rounded-md cursor-pointer hover:bg-gray-600">
            </div>

        </form>

    </div>

</body>
</html>
